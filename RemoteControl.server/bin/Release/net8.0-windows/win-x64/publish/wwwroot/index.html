<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Remote Control</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: none
        }

        body {
            font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background: #1a1a2e;
            color: #eee;
            user-select: none;
            -webkit-user-select: none
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh
        }

        .header {
            background: rgba(15,52,96,.9);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0
        }

        .header-title {
            font-size: 1.1em;
            color: #00d9ff;
            font-weight: 600
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .75em
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4757;
            display: inline-block;
            margin-right: 4px
        }

            .status-dot.on {
                background: #00ff88;
                box-shadow: 0 0 8px #00ff88
            }

        .layout-badge {
            background: #4361ee;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer
        }

        .tabs {
            display: flex;
            background: rgba(0,0,0,.3);
            flex-shrink: 0
        }

        .tab {
            flex: 1;
            padding: 12px 4px;
            background: 0;
            border: 0;
            color: #666;
            font-size: 11px;
            cursor: pointer;
            border-bottom: 2px solid transparent
        }

            .tab.active {
                color: #00d9ff;
                border-bottom-color: #00d9ff
            }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: none;
            flex-direction: column
        }

            .content.active {
                display: flex
            }

            .content.noscroll {
                overflow: hidden;
                padding: 8px
            }

        .section {
            background: rgba(22,33,62,.8);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px
        }

        h2 {
            color: #ff6b6b;
            margin: 0 0 10px;
            font-size: .8em;
            text-transform: uppercase;
            letter-spacing: 1px
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .btn {
            padding: 12px 14px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            -webkit-tap-highlight-color: transparent
        }

            .btn:active {
                transform: scale(.95);
                opacity: .8
            }

        .btn-primary {
            background: #4361ee;
            color: #fff
        }

        .btn-success {
            background: #2d6a4f;
            color: #fff
        }

        .btn-warning {
            background: #e67e22;
            color: #fff
        }

        .btn-danger {
            background: #e63946;
            color: #fff
        }

        .btn-dark {
            background: #333;
            color: #fff
        }

        .btn-icon {
            font-size: 18px;
            padding: 10px 14px
        }

        .btn-wide {
            flex: 1;
            min-width: 60px
        }

        .volume-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px
        }

        .volume-value {
            font-size: 1.1em;
            font-weight: 700;
            color: #00d9ff;
            min-width: 45px;
            text-align: right
        }

        .volume-slider {
            flex: 1;
            height: 32px;
            -webkit-appearance: none;
            background: linear-gradient(to right,#4361ee var(--val,50%),#2a2a4a var(--val,50%));
            border-radius: 16px;
            outline: 0
        }

            .volume-slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 26px;
                height: 26px;
                background: #fff;
                border-radius: 50%;
                box-shadow: 0 2px 6px rgba(0,0,0,.3)
            }

        .device-select {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,.3);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-top: 8px
        }

            .device-select option {
                background: #1a1a2e
            }

        .touchpad {
            background: rgba(0,0,0,.4);
            border: 2px solid rgba(67,97,238,.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 13px;
            touch-action: none
        }

            .touchpad.active {
                border-color: #4361ee;
                background: rgba(67,97,238,.15)
            }

            .touchpad.dragging {
                border-color: #e67e22
            }

        .touchpad-hint {
            font-size: 10px;
            color: #333;
            margin-top: 5px
        }

        .mouse-buttons {
            display: flex;
            gap: 6px;
            margin-top: 8px
        }

            .mouse-buttons .btn {
                flex: 1;
                padding: 14px
            }

        .keyboard-input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,.3);
            border: 2px solid rgba(67,97,238,.3);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: 0
        }

            .keyboard-input:focus {
                border-color: #4361ee;
                background: rgba(67,97,238,.1)
            }

            .keyboard-input::placeholder {
                color: #444
            }

        .arrows-grid {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 6px;
            max-width: 160px;
            margin: 0 auto
        }

            .arrows-grid .btn {
                padding: 16px;
                font-size: 18px
            }

            .arrows-grid .empty {
                visibility: hidden
            }

        .macro-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,.2);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 6px
        }

        .macro-name {
            font-weight: 500;
            color: #00d9ff
        }

        .macro-category {
            font-size: .7em;
            background: #4361ee;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px
        }

        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,.9);
            color: #fff;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: .85em;
            transition: transform .25s;
            z-index: 1000
        }

            #toast.show {
                transform: translateX(-50%) translateY(0)
            }

        /* Stream - 16:9 constrained */
        .stream-wrap {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 6px
        }

        .stream-view {
            width: 100%;
            max-height: 40vh;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

            .stream-view canvas {
                width: 100%;
                height: 100%;
                object-fit: contain
            }

        .stream-overlay {
            position: absolute;
            color: #666;
            font-size: 14px
        }

        .stream-controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0
        }

        .stream-touchpad {
            flex: 1;
            min-height: 80px
        }

        .stream-controls.kb-mode .stream-touchpad,
        .stream-controls.kb-mode .mouse-buttons,
        .stream-controls.kb-mode .zoom-controls {
            display: none
        }

        .stream-controls .keyboard-input {
            display: none
        }

        .stream-controls.kb-mode .keyboard-input {
            display: block
        }

        .zoom-controls {
            display: flex;
            gap: 6px;
            justify-content: center
        }

            .zoom-controls .btn {
                padding: 8px 14px
            }

        .quick-keys {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap
        }

            .quick-keys .btn {
                padding: 8px 12px;
                font-size: 12px
            }
        .stream-info {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,.7);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: #0f0
        }
        .mouse-btn.active {
            transform: scale(.92);
            opacity: .7;
            transition: none
        }

        .mouse-btn {
            transition: transform .1s,opacity .1s
        }

        .stream-settings {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px
        }

        .fps-control {
            display: flex;
            align-items: center;
            gap: 4px
        }

        .fps-label {
            color: #888;
            font-size: 11px
        }

        .fps-value {
            color: #0f0;
            font-size: 12px;
            min-width: 24px;
            text-align: center
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 11px
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="header-title">🖥️ Remote</div>
            <div class="header-status">
                <span><span class="status-dot" id="wg-dot"></span><span id="wg-status">--</span></span>
                <span class="layout-badge" id="layout-badge" onclick="toggleLayout()">--</span>
                <span id="vol-display">--%</span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="main">Main</button>
            <button class="tab" data-tab="mouse">Mouse</button>
            <button class="tab" data-tab="keys">Keys</button>
            <button class="tab" data-tab="stream">Stream</button>
            <button class="tab" data-tab="macros">Macros</button>
        </div>

        <!-- MAIN -->
        <div id="tab-main" class="content active">
            <div class="section">
                <h2>Volume</h2>
                <div class="volume-row">
                    <span class="volume-value" id="vol-value">--%</span>
                    <input type="range" min="0" max="100" value="50" class="volume-slider" id="vol-slider">
                </div>
                <div class="buttons">
                    <button class="btn btn-dark btn-icon" onclick="volAction('mute')">🔇</button>
                    <button class="btn btn-dark btn-icon" onclick="volAction('down')">🔉</button>
                    <button class="btn btn-dark btn-icon" onclick="volAction('up')">🔊</button>
                </div>
                <select class="device-select" id="audio-device"></select>
            </div>

            <div class="section">
                <h2>Media</h2>
                <div class="buttons">
                    <button class="btn btn-dark btn-icon" onclick="api('POST','/api/key/prev')">⏮</button>
                    <button class="btn btn-primary btn-icon" onclick="api('POST','/api/key/playpause')">⏯</button>
                    <button class="btn btn-dark btn-icon" onclick="api('POST','/api/key/next')">⏭</button>
                    <button class="btn btn-dark btn-icon" onclick="api('POST','/api/key/stop')">⏹</button>
                </div>
            </div>

            <div class="section">
                <h2>System</h2>
                <div class="buttons">
                    <button class="btn btn-warning" onclick="api('POST','/api/combo',{keys:['win','d']})">Desktop</button>
                    <button class="btn btn-warning" onclick="api('POST','/api/combo',{keys:['alt','tab']})">Alt+Tab</button>
                    <button class="btn btn-danger" onclick="api('POST','/api/combo',{keys:['alt','f4']})">Alt+F4</button>
                    <button class="btn btn-dark" onclick="api('POST','/api/key/f11')">F11</button>
                </div>
            </div>

            <div class="section">
                <h2>WireGuard</h2>
                <button class="btn btn-primary btn-wide" onclick="toggleWireGuard()">Toggle VPN</button>
            </div>
        </div>

        <!-- MOUSE -->
        <div id="tab-mouse" class="content">
            <div class="section" style="flex:1;display:flex;flex-direction:column">
                <h2>Touchpad</h2>
                <div class="touchpad" id="touchpad" style="flex:1;min-height:250px">
                    <div>Drag to move</div>
                    <div class="touchpad-hint">Tap | DoubleTap | Tap-Hold-Drag</div>
                    <div class="touchpad-hint">Two fingers = Scroll</div>
                </div>
                <div class="mouse-buttons">
                    <button class="btn btn-primary mouse-btn" data-btn="left">Left</button>
                    <button class="btn btn-dark mouse-btn" data-btn="middle">Mid</button>
                    <button class="btn btn-primary mouse-btn" data-btn="right">Right</button>
                </div>
            </div>
        </div>

        <!-- KEYS -->
        <div id="tab-keys" class="content">
            <div class="section">
                <h2>Live Input (realtime)</h2>
                <input type="text" class="keyboard-input" id="live-input" placeholder="Type here - sends instantly..." autocomplete="off">
            </div>

            <div class="section">
                <h2>Send Text (batch)</h2>
                <input type="text" class="keyboard-input" id="text-input" placeholder="Type, then press Send..." autocomplete="off">
                <div class="buttons" style="margin-top:8px">
                    <button class="btn btn-primary btn-wide" onclick="sendText()">Send</button>
                    <button class="btn btn-dark" onclick="$('#text-input').value=''">Clear</button>
                </div>
            </div>

            <div class="section">
                <h2>Arrows</h2>
                <div class="arrows-grid">
                    <div class="empty"></div>
                    <button class="btn btn-dark" onclick="api('POST','/api/key/up')">↑</button>
                    <div class="empty"></div>
                    <button class="btn btn-dark" onclick="api('POST','/api/key/left')">←</button>
                    <button class="btn btn-primary" onclick="api('POST','/api/key/enter')">↵</button>
                    <button class="btn btn-dark" onclick="api('POST','/api/key/right')">→</button>
                    <div class="empty"></div>
                    <button class="btn btn-dark" onclick="api('POST','/api/key/down')">↓</button>
                    <div class="empty"></div>
                </div>
            </div>

            <div class="section">
                <h2>Common</h2>
                <div class="buttons">
                    <button class="btn btn-dark" onclick="api('POST','/api/key/space')">Space</button>
                    <button class="btn btn-dark" onclick="api('POST','/api/key/tab')">Tab</button>
                    <button class="btn btn-dark" onclick="api('POST','/api/key/esc')">Esc</button>
                    <button class="btn btn-dark" onclick="api('POST','/api/key/backspace')">⌫</button>
                    <button class="btn btn-dark" onclick="api('POST','/api/key/delete')">Del</button>
                </div>
            </div>

            <div class="section">
                <h2>Combos</h2>
                <div class="buttons">
                    <button class="btn btn-primary" onclick="api('POST','/api/combo',{keys:['ctrl','c']})">^C</button>
                    <button class="btn btn-primary" onclick="api('POST','/api/combo',{keys:['ctrl','v']})">^V</button>
                    <button class="btn btn-primary" onclick="api('POST','/api/combo',{keys:['ctrl','z']})">^Z</button>
                    <button class="btn btn-primary" onclick="api('POST','/api/combo',{keys:['ctrl','a']})">^A</button>
                    <button class="btn btn-primary" onclick="api('POST','/api/combo',{keys:['ctrl','s']})">^S</button>
                    <button class="btn btn-warning" onclick="api('POST','/api/combo',{keys:['ctrl','shift','esc']})">TaskMgr</button>
                </div>
            </div>
        </div>

        <!-- STREAM -->
        <div id="tab-stream" class="content noscroll">
            <div class="stream-wrap">
                <div class="stream-view" id="stream-view">
                    <canvas id="stream-canvas"></canvas>
                    <div class="stream-overlay" id="stream-overlay">Tap to start</div>
                    <div class="stream-info" id="stream-info"></div>
                </div>
                <div class="stream-controls" id="stream-controls">
                    <div class="stream-settings">
                        <div class="fps-control">
                            <span class="fps-label">FPS:</span>
                            <button class="btn btn-dark btn-sm" onclick="setFps(10)">10</button>
                            <button class="btn btn-dark btn-sm" onclick="setFps(20)">20</button>
                            <button class="btn btn-dark btn-sm" onclick="setFps(30)">30</button>
                            <button class="btn btn-primary btn-sm" onclick="setFps(60)">60</button>
                            <span id="fps-display" class="fps-value">60</span>
                        </div>
                        <div class="zoom-controls">
                            <button class="btn btn-dark" onclick="zoomOut()">−</button>
                            <span id="zoom-label" style="color:#888;font-size:12px;min-width:50px;text-align:center">1.0x</span>
                            <button class="btn btn-dark" onclick="zoomIn()">+</button>
                            <button class="btn btn-dark" onclick="zoomReset()">Reset</button>
                        </div>
                    </div>
                    <div class="touchpad stream-touchpad" id="stream-touchpad">Touchpad</div>
                    <div class="mouse-buttons">
                        <button class="btn btn-primary mouse-btn" data-btn="left">L</button>
                        <button class="btn btn-dark mouse-btn" data-btn="middle">M</button>
                        <button class="btn btn-primary mouse-btn" data-btn="right">R</button>
                    </div>
                    <input type="text" class="keyboard-input" id="stream-input" placeholder="Type here..." autocomplete="off">
                    <div class="quick-keys">
                        <button class="btn btn-dark" onclick="api('POST','/api/key/esc')">Esc</button>
                        <button class="btn btn-dark" onclick="api('POST','/api/key/tab')">Tab</button>
                        <button class="btn btn-primary" onclick="api('POST','/api/key/enter')">↵</button>
                        <button class="btn btn-dark" onclick="api('POST','/api/key/backspace')">⌫</button>
                        <button class="btn btn-dark" onclick="api('POST','/api/key/space')">___</button>
                        <button class="btn btn-success" id="btn-toggle-kb">⌨️</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- MACROS -->
        <div id="tab-macros" class="content">
            <div class="section">
                <h2>Macros</h2>
                <div id="macros-list"></div>
                <button class="btn btn-success" style="width:100%;margin-top:10px" onclick="alert('Coming soon!')">+ New</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const $ = s => document.querySelector(s);
        const $$ = s => document.querySelectorAll(s);

        function toast(m, d = 1500) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), d) }

        async function api(method, path, body = null, silent = false) {
            try {
                const opts = { method };
                if (body) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(body) }
                const r = await fetch(path, opts);
                const d = await r.json();
                if (!silent) {
                    let m = d.status || d.key || d.layout || d.name || 'OK';
                    toast(m);
                }
                return d;
            } catch (e) { console.error(path, e); if (!silent) toast('Error'); return { success: false } }
        }
        const apiS = (m, p, b) => api(m, p, b, true);

        // Tabs
        let currentTab = 'main';
        $$('.tab').forEach(t => t.onclick = () => {
            $$('.tab').forEach(x => x.classList.remove('active'));
            $$('.content').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            $('#tab-' + t.dataset.tab).classList.add('active');

            if (currentTab === 'stream' && t.dataset.tab !== 'stream') stopStream();
            if (t.dataset.tab === 'stream') startStream();
            currentTab = t.dataset.tab;
        });

        // === STATUS ===
        async function updateStatus() {
            try {
                const vol = await apiS('GET', '/api/volume');
                if (vol && vol.volume !== undefined && vol.volume >= 0) {
                    setVolumeUI(vol.volume);
                }

                const wg = await apiS('GET', '/api/wg/status');
                if (wg && wg.status) {
                    $('#wg-status').textContent = wg.status;
                    $('#wg-dot').classList.toggle('on', wg.status === 'Running');
                }

                const layout = await apiS('GET', '/api/keyboard/layout');
                if (layout && layout.layout) {
                    $('#layout-badge').textContent = layout.layout;
                }
            } catch (e) { console.error('updateStatus', e) }
        }

        function setVolumeUI(v) {
            $('#vol-display').textContent = v + '%';
            $('#vol-value').textContent = v + '%';
            $('#vol-slider').value = v;
            $('#vol-slider').style.setProperty('--val', v + '%');
        }

        async function toggleWireGuard() {
            toast('Toggling...');
            await api('POST', '/api/wg/toggle');
            setTimeout(updateStatus, 500);
        }

        function toggleLayout() {
            api('POST', '/api/keyboard/layout/toggle').then(() => setTimeout(updateStatus, 200));
        }

        // === VOLUME ===
        let volTimeout;
        $('#vol-slider').oninput = function () {
            const v = this.value;
            setVolumeUI(v);
            clearTimeout(volTimeout);
            volTimeout = setTimeout(() => apiS('POST', '/api/volume/set', { level: parseInt(v) }), 100);
        };

        async function volAction(action) {
            if (action === 'mute') {
                await apiS('POST', '/api/volume/mute');
            } else if (action === 'up') {
                await apiS('POST', '/api/key/volup');
            } else if (action === 'down') {
                await apiS('POST', '/api/key/voldown');
            }
            // Обновляем через небольшую задержку
            setTimeout(updateStatus, 200);
        }

        // === AUDIO DEVICES ===
        async function loadAudioDevices() {
            const d = await apiS('GET', '/api/audio/devices');
            const sel = $('#audio-device');
            if (d && d.success && d.devices && d.devices.length) {
                sel.innerHTML = d.devices.map(x =>
                    `<option value="${x.name}"${x.isDefault ? ' selected' : ''}>${x.name}</option>`
                ).join('');
            } else {
                sel.innerHTML = '<option>No devices</option>';
            }
        }

        $('#audio-device').onchange = async function () {
            const name = this.value;
            toast('Switching...');
            const result = await api('POST', '/api/audio/device', { name }, true);
            if (result && result.success) {
                toast('Switched to: ' + name);
            } else {
                toast('Failed to switch');
            }
            setTimeout(() => {
                loadAudioDevices();
                updateStatus();
            }, 1000);
        };



        // === GLOBAL TOUCH STATE ===
        const activeTouches = new Map(); // id -> 'touchpad' | 'button'

        // === FIRE AND FORGET ===
        function fire(method, path, body = null) {
            const opts = { method };
            if (body) {
                opts.headers = { 'Content-Type': 'application/json' };
                opts.body = JSON.stringify(body);
            }
            fetch(path, opts).catch(() => { });
        }

        // === MOUSE BUTTONS (down/up) ===
        document.querySelectorAll('.mouse-btn').forEach(btn => {
            const btnType = btn.dataset.btn;
            if (!btnType) return;

            btn.addEventListener('touchstart', e => {
                e.preventDefault();
                e.stopPropagation();

                for (const touch of e.changedTouches) {
                    activeTouches.set(touch.identifier, 'button');
                }

                btn.classList.add('active');
                fire('POST', `/api/mouse/down/${btnType}`);
            }, { passive: false, capture: true });

            btn.addEventListener('touchend', e => {
                e.preventDefault();
                e.stopPropagation();

                for (const touch of e.changedTouches) {
                    activeTouches.delete(touch.identifier);
                }

                btn.classList.remove('active');
                fire('POST', `/api/mouse/up/${btnType}`);
            }, { passive: false, capture: true });

            btn.addEventListener('touchcancel', e => {
                for (const touch of e.changedTouches) {
                    activeTouches.delete(touch.identifier);
                }
                btn.classList.remove('active');
                fire('POST', `/api/mouse/up/${btnType}`);
            }, { capture: true });

            // Desktop fallback
            btn.addEventListener('mousedown', e => {
                if ('ontouchstart' in window) return;
                btn.classList.add('active');
                fire('POST', `/api/mouse/down/${btnType}`);
            });

            btn.addEventListener('mouseup', e => {
                if ('ontouchstart' in window) return;
                btn.classList.remove('active');
                fire('POST', `/api/mouse/up/${btnType}`);
            });

            btn.addEventListener('mouseleave', e => {
                if (btn.classList.contains('active')) {
                    btn.classList.remove('active');
                    fire('POST', `/api/mouse/up/${btnType}`);
                }
            });
        });

        // === TOUCHPAD ===
        function initTouchpad(id) {
            const pad = document.getElementById(id);
            if (!pad) return;

            let lastPos = null;
            let tapStartTime = 0;
            let hasMoved = false;
            let firstTapTime = 0;
            let waitingSecondTap = false;
            let isDragging = false;
            let dragStarted = false;
            let singleTapTimer = null;
            let dragTimer = null;
            let padTouches = new Set(); // ID пальцев на этом тачпаде

            const SENS = 1.8;
            const TAP_TIMEOUT = 280;
            const DRAG_DELAY = 140;

            pad.addEventListener('touchstart', e => {
                e.preventDefault();

                // Добавляем только те пальцы, которые НЕ на кнопках
                for (const touch of e.changedTouches) {
                    if (activeTouches.get(touch.identifier) === 'button') continue;

                    activeTouches.set(touch.identifier, 'touchpad');
                    padTouches.add(touch.identifier);
                }

                const count = padTouches.size;
                if (count === 0) return;

                pad.classList.add('active');

                // Берём первый палец на тачпаде для позиции
                let touchOnPad = null;
                for (const touch of e.touches) {
                    if (padTouches.has(touch.identifier)) {
                        touchOnPad = touch;
                        break;
                    }
                }

                if (!touchOnPad) return;

                if (count >= 2) {
                    // Два+ пальца на тачпаде = скролл
                    let sumX = 0, sumY = 0, n = 0;
                    for (const touch of e.touches) {
                        if (padTouches.has(touch.identifier)) {
                            sumX += touch.clientX;
                            sumY += touch.clientY;
                            n++;
                        }
                    }
                    lastPos = { x: sumX / n, y: sumY / n };
                    clearTimeout(singleTapTimer);
                    clearTimeout(dragTimer);
                    waitingSecondTap = false;
                    isDragging = false;
                    return;
                }

                // Один палец
                lastPos = { x: touchOnPad.clientX, y: touchOnPad.clientY };
                tapStartTime = Date.now();
                hasMoved = false;

                if (waitingSecondTap && (Date.now() - firstTapTime) < TAP_TIMEOUT) {
                    clearTimeout(singleTapTimer);
                    waitingSecondTap = false;
                    isDragging = true;

                    dragTimer = setTimeout(() => {
                        if (isDragging && !hasMoved && !dragStarted) {
                            dragStarted = true;
                            pad.classList.add('dragging');
                            fire('POST', '/api/mouse/down/left');
                        }
                    }, DRAG_DELAY);
                }
            }, { passive: false });

            pad.addEventListener('touchmove', e => {
                e.preventDefault();
                if (!lastPos) return;

                // Считаем только пальцы на тачпаде
                const padTouchList = [];
                for (const touch of e.touches) {
                    if (padTouches.has(touch.identifier)) {
                        padTouchList.push(touch);
                    }
                }

                const count = padTouchList.length;
                if (count === 0) return;

                if (count >= 2) {
                    // Скролл
                    let sumX = 0, sumY = 0;
                    for (const t of padTouchList) {
                        sumX += t.clientX;
                        sumY += t.clientY;
                    }
                    const cx = sumX / count;
                    const cy = sumY / count;

                    const dy = lastPos.y - cy;
                    lastPos = { x: cx, y: cy };

                    if (Math.abs(dy) > 1) {
                        fire('POST', '/api/mouse/scroll', { delta: Math.round(-dy * 4) });
                    }
                } else {
                    // Движение курсора
                    const touch = padTouchList[0];
                    const dx = touch.clientX - lastPos.x;
                    const dy = touch.clientY - lastPos.y;

                    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                        hasMoved = true;
                        lastPos = { x: touch.clientX, y: touch.clientY };

                        if (isDragging && !dragStarted) {
                            clearTimeout(dragTimer);
                            dragStarted = true;
                            pad.classList.add('dragging');
                            fire('POST', '/api/mouse/down/left');
                        }

                        const moveDx = Math.round(dx * SENS);
                        const moveDy = Math.round(dy * SENS);
                        if (moveDx || moveDy) {
                            fire('POST', '/api/mouse/move', { x: moveDx, y: moveDy });
                        }
                    }
                }
            }, { passive: false });

            pad.addEventListener('touchend', e => {
                e.preventDefault();

                for (const touch of e.changedTouches) {
                    padTouches.delete(touch.identifier);
                    activeTouches.delete(touch.identifier);
                }

                const remaining = padTouches.size;

                if (remaining === 0) {
                    pad.classList.remove('active', 'dragging');
                    clearTimeout(dragTimer);

                    if (dragStarted) {
                        fire('POST', '/api/mouse/up/left');
                        isDragging = false;
                        dragStarted = false;
                    } else if (isDragging) {
                        isDragging = false;
                        fire('POST', '/api/mouse/click/double');
                    } else if (!hasMoved && (Date.now() - tapStartTime) < TAP_TIMEOUT) {
                        firstTapTime = Date.now();
                        waitingSecondTap = true;

                        singleTapTimer = setTimeout(() => {
                            if (waitingSecondTap) {
                                waitingSecondTap = false;
                                fire('POST', '/api/mouse/click/left');
                            }
                        }, TAP_TIMEOUT);
                    }

                    lastPos = null;
                } else {
                    // Обновляем lastPos для оставшихся пальцев
                    let sumX = 0, sumY = 0, n = 0;
                    for (const touch of e.touches) {
                        if (padTouches.has(touch.identifier)) {
                            sumX += touch.clientX;
                            sumY += touch.clientY;
                            n++;
                        }
                    }
                    if (n > 0) {
                        lastPos = { x: sumX / n, y: sumY / n };
                    }
                }
            }, { passive: false });

            pad.addEventListener('touchcancel', e => {
                for (const touch of e.changedTouches) {
                    padTouches.delete(touch.identifier);
                    activeTouches.delete(touch.identifier);
                }

                if (padTouches.size === 0) {
                    pad.classList.remove('active', 'dragging');
                    if (dragStarted) {
                        fire('POST', '/api/mouse/up/left');
                    }
                    clearTimeout(singleTapTimer);
                    clearTimeout(dragTimer);
                    isDragging = false;
                    dragStarted = false;
                    waitingSecondTap = false;
                    lastPos = null;
                }
            });
        }

        // === INIT ===
        initTouchpad('touchpad');
        initTouchpad('stream-touchpad');





        // === KEYBOARD ===
        // Live input - накапливаем и отправляем пачками
        const liveInput = $('#live-input');
        if (liveInput) {
            let buffer = '';
            let sendTimer = null;

            liveInput.oninput = e => {
                const data = e.data;
                if (data) buffer += data;

                clearTimeout(sendTimer);
                sendTimer = setTimeout(() => {
                    if (buffer) {
                        apiS('POST', '/api/type', { text: buffer });
                        buffer = '';
                    }
                    liveInput.value = '';
                }, 120); // Увеличенная задержка для стабильности
            };

            liveInput.onkeydown = e => {
                const map = {
                    Backspace: 'backspace', Enter: 'enter', Tab: 'tab', Escape: 'esc',
                    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right'
                };
                if (map[e.key]) {
                    e.preventDefault();
                    // Сначала отправляем накопленный буфер
                    if (buffer) {
                        apiS('POST', '/api/type', { text: buffer });
                        buffer = '';
                        liveInput.value = '';
                    }
                    apiS('POST', '/api/key/' + map[e.key]);
                }
            };
        }

        function sendText() {
            const inp = $('#text-input');
            if (inp && inp.value) {
                api('POST', '/api/type', { text: inp.value });
                inp.value = '';
            }
        }

        // Stream input
        const streamInput = $('#stream-input');
        const streamControls = $('#stream-controls');

        if (streamInput) {
            let buffer = '';
            let sendTimer = null;

            streamInput.oninput = e => {
                const data = e.data;
                if (data) buffer += data;

                clearTimeout(sendTimer);
                sendTimer = setTimeout(() => {
                    if (buffer) {
                        apiS('POST', '/api/type', { text: buffer });
                        buffer = '';
                    }
                    streamInput.value = '';
                }, 120);
            };

            streamInput.onkeydown = e => {
                const map = {
                    Backspace: 'backspace', Enter: 'enter', Tab: 'tab', Escape: 'esc',
                    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right'
                };
                if (map[e.key]) {
                    e.preventDefault();
                    if (buffer) {
                        apiS('POST', '/api/type', { text: buffer });
                        buffer = '';
                        streamInput.value = '';
                    }
                    apiS('POST', '/api/key/' + map[e.key]);
                }
            };

            streamInput.onfocus = () => streamControls.classList.add('kb-mode');
            streamInput.onblur = () => streamControls.classList.remove('kb-mode');
        }

        $('#btn-toggle-kb').onclick = () => {
            if (streamControls.classList.contains('kb-mode')) {
                streamControls.classList.remove('kb-mode');
                streamInput.blur();
            } else {
                streamControls.classList.add('kb-mode');
                setTimeout(() => streamInput.focus(), 50);
            }
        };

        // === STREAM ===
        let ws = null;
        let currentZoom = 1;
        const canvas = $('#stream-canvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        const streamView = $('#stream-view');

        function startStream() {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            const overlay = $('#stream-overlay');
            if (overlay) { overlay.style.display = 'flex'; overlay.textContent = 'Connecting...'; }

            loadFps(); // Загружаем текущий FPS

            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws/screen`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                if (overlay) overlay.style.display = 'none';
                updateZoomLabel();
            };

            ws.onmessage = e => {
                if (!ctx) return;
                const blob = new Blob([e.data], { type: 'image/jpeg' });
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                };
                img.src = url;
            };

            ws.onclose = () => {
                ws = null;
                const overlay = $('#stream-overlay');
                if (overlay) { overlay.style.display = 'flex'; overlay.textContent = 'Tap to start'; }
            };

            ws.onerror = () => { if (ws) ws.close() };
        }

        function stopStream() {
            if (ws) { ws.close(); ws = null }
        }

        if (streamView) {
            streamView.onclick = e => {
                // Не стартуем если кликнули на overlay
                if (e.target.id === 'stream-overlay') {
                    if (!ws || ws.readyState !== WebSocket.OPEN) startStream();
                }
            };
        }

        async function zoomIn() {
            const d = await apiS('POST', '/api/screen/zoom', { action: 'in' });
            if (d) updateZoomFromResponse(d);
        }

        async function zoomOut() {
            const d = await apiS('POST', '/api/screen/zoom', { action: 'out' });
            if (d) updateZoomFromResponse(d);
        }

        async function zoomReset() {
            const d = await apiS('POST', '/api/screen/zoom', { action: 'reset' });
            if (d) updateZoomFromResponse(d);
            toast('Reset');
        }

        async function zoomSet(level) {
            const d = await apiS('POST', '/api/screen/zoom', { action: 'set', level });
            if (d) updateZoomFromResponse(d);
        }

        async function panBy(dx, dy) {
            await apiS('POST', '/api/screen/pan', { x: dx, y: dy, absolute: false });
        }

        function updateZoomFromResponse(d) {
            if (d.zoom !== undefined) {
                currentZoom = d.zoom;
                updateZoomLabel();
            }
        }

        function updateZoomLabel() {
            const label = $('#zoom-label');
            if (label) label.textContent = currentZoom.toFixed(1) + 'x';
            const info = $('#stream-info');
            if (info) info.textContent = currentZoom > 1 ? currentZoom.toFixed(1) + 'x' : '';
        }

        // === FPS CONTROL ===
        async function setFps(fps) {
            const d = await apiS('POST', '/api/screen/fps', { fps: fps });
            if (d && d.fps !== undefined) {
                document.getElementById('fps-display').textContent = d.fps;
                // Подсветить активную кнопку
                document.querySelectorAll('.fps-control .btn').forEach(btn => {
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-dark');
                });
                const activeBtn = document.querySelector(`.fps-control .btn[onclick="setFps(${fps})"]`);
                if (activeBtn) {
                    activeBtn.classList.remove('btn-dark');
                    activeBtn.classList.add('btn-primary');
                }
                toast('FPS: ' + d.fps);
            }
        }

        // Загрузить текущий FPS при старте стрима
        async function loadFps() {
            const d = await apiS('GET', '/api/screen/fps');
            if (d && d.fps !== undefined) {
                document.getElementById('fps-display').textContent = d.fps;
            }
        }

        // ===== PINCH ZOOM & PAN на canvas =====
        if (canvas) {
            let lastTouches = null;
            let lastPinchDist = null;
            let isPanning = false;

            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                if (e.touches.length === 2) {
                    // Pinch start
                    lastPinchDist = getPinchDist(e.touches);
                    lastTouches = [
                        { x: e.touches[0].clientX, y: e.touches[0].clientY },
                        { x: e.touches[1].clientX, y: e.touches[1].clientY }
                    ];
                } else if (e.touches.length === 1 && currentZoom > 1) {
                    // Pan start (only when zoomed)
                    isPanning = true;
                    lastTouches = [{ x: e.touches[0].clientX, y: e.touches[0].clientY }];
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', e => {
                e.preventDefault();

                if (e.touches.length === 2 && lastPinchDist !== null) {
                    // Pinch zoom
                    const dist = getPinchDist(e.touches);
                    const scale = dist / lastPinchDist;

                    if (Math.abs(scale - 1) > 0.05) {
                        const newZoom = currentZoom * scale;
                        zoomSet(newZoom);
                        lastPinchDist = dist;
                    }

                    // Pan while pinching
                    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    const lastCx = (lastTouches[0].x + lastTouches[1].x) / 2;
                    const lastCy = (lastTouches[0].y + lastTouches[1].y) / 2;

                    const dx = (lastCx - cx) / canvas.clientWidth;
                    const dy = (lastCy - cy) / canvas.clientHeight;

                    if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
                        panBy(dx, dy);
                    }

                    lastTouches = [
                        { x: e.touches[0].clientX, y: e.touches[0].clientY },
                        { x: e.touches[1].clientX, y: e.touches[1].clientY }
                    ];

                } else if (e.touches.length === 1 && isPanning && lastTouches) {
                    // Single finger pan
                    const dx = (lastTouches[0].x - e.touches[0].clientX) / canvas.clientWidth;
                    const dy = (lastTouches[0].y - e.touches[0].clientY) / canvas.clientHeight;

                    if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
                        panBy(dx, dy);
                        lastTouches = [{ x: e.touches[0].clientX, y: e.touches[0].clientY }];
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchend', e => {
                if (e.touches.length < 2) {
                    lastPinchDist = null;
                }
                if (e.touches.length === 0) {
                    isPanning = false;
                    lastTouches = null;
                }
            });

            function getPinchDist(touches) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.hypot(dx, dy);
            }
        }

        // Click на overlay для старта
        $('#stream-overlay')?.addEventListener('click', () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) startStream();
        });

        // === MACROS ===
        async function loadMacros() {
            const d = await apiS('GET', '/api/macros');
            const list = $('#macros-list');
            if (!list) return;
            if (d && d.macros && d.macros.length) {
                list.innerHTML = d.macros.map(m => `
                <div class="macro-item">
                    <div><span class="macro-name">${m.name}</span><span class="macro-category">${m.category}</span></div>
                    <div class="buttons">
                        <button class="btn btn-primary" style="padding:6px 12px" onclick="api('POST','/api/macros/${m.id}/run')">▶</button>
                        <button class="btn btn-danger" style="padding:6px 10px" onclick="deleteMacro('${m.id}')">×</button>
                    </div>
                </div>
            `).join('');
            } else {
                list.innerHTML = '<div style="color:#555;text-align:center;padding:20px">No macros</div>';
            }
        }
        async function deleteMacro(id) {
            if (confirm('Delete?')) { await api('DELETE', '/api/macros/' + id); loadMacros() }
        }

        // === INIT ===
        updateStatus();
        loadAudioDevices();
        loadMacros();
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
